{% extends 'base.html' %}

{% block title %}{{ action }} Internship Offer{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow">
    <h2 class="text-2xl font-bold mb-6">{{ action }} Internship Offer</h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div class="flex flex-col">
                <label class="mb-1 font-semibold text-gray-700">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            {{ action }}
        </button>
    </form>
</div>
{% endblock %}
