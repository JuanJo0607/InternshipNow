{% extends 'base.html' %}
{% load static %}

{% block title %}Iniciar sesión | InternshipNow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto card p-8">
    <div class="text-center mb-8">
        <img src="{% static 'images/logo.svg' %}" alt="InternshipNow logo" class="mx-auto h-16 w-16" />
        <h1 class="mt-5 text-3xl font-bold text-[#111827]">Bienvenido</h1>
        <p class="mt-3 text-sm text-[#6B7280]">Talento real para oportunidades reales.</p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="form-label">Usuario</label>
            <input type="text" name="username" required placeholder="Correo o usuario" class="input-field" />
        </div>

        <div>
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" required placeholder="********" class="input-field" />
        </div>

        <button type="submit" class="btn-primary w-full">Ingresar</button>
    </form>

    <p class="mt-6 text-center text-[#6B7280]">
        ¿No tienes cuenta? <a href="{% url 'register' %}" class="text-[#111827] font-semibold">Regístrate</a>
    </p>
</div>
{% endblock %}
